# Data pipeline (FR-D1 to FR-D8). Same preprocessing for every dataset (FR-D6).
root: data
raw_dir: ${.root}/raw
crops_dir: ${.root}/crops
manifest_dir: ${.root}/manifests

frames:
  train_per_video: 32        # evenly spaced (FR-D1)
  test_per_video: 32         # configurable for testing

faces:
  detector: sfd              # face-alignment SFD, one detector everywhere (FR-D2)
  landmarks: 68              # FR-D3
  crop_scale: 1.3            # FR-D4
  size: 224

workers: 4                   # CPU workers for preprocessing (FR-D8)

datasets:
  ffpp:
    compression: [c23]       # c40 for the 140 test videos only (M6)
    methods: [Deepfakes, Face2Face, FaceSwap, NeuralTextures]
    splits: official         # 720 / 140 / 140 videos
  celebdf_v2:
    split: test              # 518 test videos (M2)
  dfdc:
    subset_size: 1000
    subset_seed: 0
  deeperforensics:
    split: test
  wilddeepfake:
    split: test
  df40:
    enabled: false           # optional, week 8
