[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-detector"
version = "0.1.0"
description = "Cross-dataset deepfake detection with a Vision Transformer trained on FaceForensics++"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"

[project.scripts]
predict = "deepfake_detector.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["N812"]  # allow "import albumentations as A"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=deepfake_detector --cov-report=term-missing"

[tool.coverage.run]
source = ["src/deepfake_detector"]
omit = ["src/deepfake_detector/train.py"]

[tool.coverage.report]
fail_under = 70  # NFR-9
